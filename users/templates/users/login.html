{% extends 'restaurant/base.html'%}
{% block content %}
<div class="container mt-5">
    <h1>Вход на сайт</h1>
        <form method="post" class="p-4 rounded shadow-sm" style="background-color: rgba(0, 0, 0, 0.5); border: none;">
            <div class="col-6">
                <div class="card">
                    <div class="card-body">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary">Войти</button>
                    </div>
                </div>
            </div>
        </form>
</div>
{% endblock %}
